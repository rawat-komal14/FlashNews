<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashNews | Intelligent Feed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container header-top">
            <div class="brand">
                <div class="brand-icon">FN</div>
                <h1>FlashNews</h1>
            </div>
            
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Explore stories...">
                <button id="search-btn">🔍</button>
            </div>

            <div class="action-group">
                <button id="theme-toggle">🌓 Theme</button>
                <button id="show-bookmarks">🔖 Saved</button>
                <button id="start-quiz-btn">🧠 Challenge</button>
            </div>
        </div>

        <nav class="category-nav">
            <button class="category-btn active" data-category="general">Front Page</button>
            <button class="category-btn" data-category="business">Finance</button>
            <button class="category-btn" data-category="technology">Innovation</button>
            <button class="category-btn" data-category="sports">Athletics</button>
        </nav>
    </header>

    <main class="container">
        <h2 id="section-title">Latest Updates</h2>
        <div id="news-grid" class="news-grid">
            </div>
    </main>

    <div id="quiz-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Knowledge Challenge</h2>
            <hr>
            <div id="quiz-container">
                </div>
            <div id="quiz-footer">
                <button id="submit-quiz" class="btn-primary" style="display:none;">Verify Answer</button>
            </div>
            <div id="quiz-results"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
